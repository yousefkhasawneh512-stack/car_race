<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Irbid Drive</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}#game{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.h{position:fixed;pointer-events:none;text-shadow:0 1px 4px #000}
#spd{right:20px;bottom:calc(16px + env(safe-area-inset-bottom));font-size:46px;font-weight:700;text-align:right}
#spd small{display:block;font-size:14px;font-weight:500}
#top{left:16px;top:calc(12px + env(safe-area-inset-top));font-size:14px;line-height:1.5}
#race{left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);font-size:22px;font-weight:700;text-align:center}
#drift{left:50%;top:62%;transform:translateX(-50%);font-size:30px;font-weight:700;color:#ffd24a}
#car{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:46vw;font-size:14px;background:#000b;color:#fff;border:1px solid #fff5;border-radius:6px;padding:4px}
#spinBtn{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 14px;font-size:14px;border-radius:8px;border:1px solid #fff6;background:#000b;color:#ffd24a;cursor:pointer}
#wheel{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:5}
#wheel .box{text-align:center;max-width:92vw}#wheel button{margin:6px;padding:8px 16px;font-size:16px;border-radius:8px;border:0;cursor:pointer}#wheel button:disabled{opacity:.4;cursor:default}#wres{min-height:44px;font-size:17px;margin:8px 0}
#heist{left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);font-size:20px;font-weight:700;color:#ff6b6b;text-align:center}
#shop{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:5}
#shop .box{background:#14161a;padding:18px 20px;border-radius:12px;min-width:min(440px,92vw);max-width:92vw}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #fff2}.row small{opacity:.7}
#shop button{padding:8px 14px;font-size:15px;border-radius:8px;border:0;cursor:pointer}#shop button:disabled{opacity:.4;cursor:default}#shoppts{margin-bottom:6px;color:#ffd24a;font-weight:700}
#osmcr{position:fixed;right:6px;bottom:4px;z-index:5;font:11px/1.2 Arial,sans-serif;color:rgba(255,255,255,.78);background:rgba(0,0,0,.38);padding:2px 6px;border-radius:4px;pointer-events:auto;text-shadow:0 1px 2px #000}#osmcr a{color:#bfe3ff;text-decoration:none}
#toast{left:50%;top:30%;transform:translateX(-50%);text-align:center;font-size:18px}
#toast div{background:#000a;padding:6px 14px;border-radius:8px;margin-top:6px}
#map{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));border-radius:8px;background:#000a}
#nav{position:fixed;left:16px;bottom:calc(176px + env(safe-area-inset-bottom));width:min(330px,calc(100vw - 32px));z-index:4;font-size:14px}
#navbar{display:flex;gap:6px}
#navIn{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid #fff6;background:#000c;color:#fff;font-size:14px;outline:none}#navIn:focus{border-color:#4aa3ff}
#navX{display:none;padding:0 11px;border-radius:8px;border:1px solid #fff6;background:#000c;color:#ff8a7a;font-size:16px;cursor:pointer}
#navRes{display:none;background:#101318f2;border-radius:8px;margin-bottom:6px;max-height:38vh;overflow:auto;border:1px solid #fff3}
.nr{padding:7px 10px;cursor:pointer;border-bottom:1px solid #fff1;display:flex;justify-content:space-between;gap:10px;align-items:center}.nr:hover,.nr.on{background:#27406b}.nr small{opacity:.65;white-space:nowrap;font-size:12px}
#navDir{display:none;background:#101318f2;border-radius:8px;margin-bottom:6px;border:1px solid #fff3}
#ndT{padding:8px 10px;border-bottom:1px solid #fff2;line-height:1.35}#ndR{color:#7fc0ff;font-size:13px}
#ndS{max-height:26vh;overflow:auto;position:relative}.st{padding:5px 10px;font-size:13px;display:flex;gap:6px;align-items:baseline;opacity:.85}.st b{width:20px;flex:none;text-align:center}.st small{margin-left:auto;opacity:.6;white-space:nowrap}.st.cur{background:#27406b;opacity:1}.st.done{opacity:.35}
#navBan{left:50%;top:calc(176px + env(safe-area-inset-top));transform:translateX(-50%);max-width:min(560px,90vw);text-align:center;font-size:18px;font-weight:700}#navBan:not(:empty){background:#0b2f66e6;padding:7px 16px;border-radius:10px;border:1px solid #6db3ff88}#navBan .gl{font-size:22px;margin-right:4px}
</style></head><body>
<div id="top" class="h"></div><select id="car"></select><div id="heist" class="h"></div><div id="shop"><div class="box"><h2 style="margin:0 0 6px">🔧 Apex Drift Customs</h2><div id="shoppts"></div><div id="shopbody"></div><button id="shopx" style="margin-top:12px">Close</button></div></div><button id="spinBtn"></button><div id="wheel"><div class="box"><h2 style="margin:0 0 8px">Wheel spin</h2><canvas id="wc" width="300" height="300"></canvas><div id="wres"></div><div id="wcred"></div><button id="wgo">Spin (10,000 JD)</button><button id="wx">Close</button></div></div><div id="race" class="h"></div><div id="toast" class="h"></div>
<div id="nav"><div id="navDir"><div id="ndT"></div><div id="ndS"></div></div><div id="navRes"></div><div id="navbar"><input id="navIn" type="text" placeholder="🔍 Search a place or street — M" autocomplete="off" spellcheck="false"><button id="navX" title="Stop navigation">✕</button></div></div><div id="navBan" class="h"></div>
